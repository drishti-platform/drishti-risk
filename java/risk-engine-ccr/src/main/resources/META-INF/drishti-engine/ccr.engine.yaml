# The counterparty-credit engine of Drishti Risk: exposure from supplied simulator paths (EE, EPE, EEPE, PFE), netting and collateral.
engine: 1
id: ccr
version: 0.1.0
title: Counterparty credit exposure
about: >-
  Exposure profiles and figures (current exposure, EE, ENE, effective EE, EPE, effective EPE, PFE at each confidence and its peak) for
  any scope of netting sets, counterparties, legal entities, desks, books or trades, from mark-to-market paths a simulator supplies,
  netted by set and collateralised under each set's CSA terms; each netting set's collateral view; the pre-deal check of a new trade
  against the counterparty's credit limit and its tenor buckets; and ISDA SIMM initial margin from supplied sensitivities under the
  bank's licensed parameter file. The engine never simulates nor prices: missing paths are an answer.
publisher: { id: com.ash.risk, name: Drishti Risk }
product: drishti-risk-ccr
api: "0.1"
platform: { tools: "1.1" }
codes: RSK
snapshot:
  dimensions: [ { name: date, type: date, label: Business date } ]
inputs:
  simulation-run:
    contract: risk/simulation-run@1
    about: The simulator's run for the date; its grid (dates, roles, look-back indices, tenors) and the number of paths.
    key: [ RUN_ID ]
    columns: [ RUN_ID, BATCH_ID, BUSINESS_DATE, PATHS, GRID_DATES, GRID_ROLE, LOOKBACK_OF, GRID_TENORS ]
  exposure-path:
    contract: risk/exposure-path@1
    about: One row per trade and grid point; the trade's MtM on every path (MTM).
    key: [ TRADE_ID, GRID_INDEX ]
    columns: [ TRADE_ID, GRID_INDEX, NETTING_SET, COUNTERPARTY, LEGAL_ENTITY, DESK, TT_BOOK, ASSET_CLASS, PRODUCT, SOURCE_SYSTEM,
               MATURITY_DATE, NOTIONAL, MTM ]
    vector: MTM
    scope-columns: [ COUNTERPARTY, LEGAL_ENTITY, DESK, TT_BOOK, NETTING_SET ]
  netting-set:
    contract: risk/netting-set@1
    about: Each netting set's CSA and collateral balance.
    required: false
    key: [ NETTING_SET_ID ]
    columns: [ NETTING_SET_ID, COUNTERPARTY, LEGAL_ENTITY, CSA, COLLATERAL_BALANCE ]
  csa:
    contract: risk/csa@1
    about: The CSA terms (thresholds, minimum transfer amounts, independent amount, rounding, margin period, frequency, type).
    required: false
    key: [ CSA_ID ]
    columns: [ CSA_ID, THRESHOLD_THEM, THRESHOLD_US, MTA, MTA_THEM, MTA_US, INDEPENDENT_AMOUNT, ROUNDING, MPOR_DAYS, MARGIN_FREQUENCY_DAYS, MARGIN_TYPE ]
  collateral-balance:
    contract: risk/collateral-balance@1
    about: Each balance's collateral held after haircut (NET; posted negative) and initial margin held.
    required: false
    key: [ BALANCE_ID ]
    columns: [ BALANCE_ID, NET, IM_HELD ]
  trade-valuation:
    contract: risk/trade-valuation@1
    about: Each trade's MtM on the business date (else its paths' mean at the first grid date stands in).
    required: false
    key: [ TRADE_ID ]
    columns: [ TRADE_ID, MTM ]
  credit-limit:
    contract: risk/credit-limit@1
    about: Each counterparty's credit limit (USD) and the measure it is set on (PFE 95 peak, EEPE, EPE, EE peak).
    required: false
    key: [ LIMIT_ID ]
    columns: [ LIMIT_ID, COUNTERPARTY, MEASURE, LIMIT ]
  credit-limit-bucket:
    contract: risk/credit-limit-bucket@1
    about: A credit limit's tenor buckets (0-1Y, 1-3Y, 10Y+), each with its own limit (the BUCKETS child rows of risk/credit-limit).
    required: false
    key: [ LIMIT_ID, BUCKET ]
    columns: [ LIMIT_ID, BUCKET, LIMIT ]
  sensitivity-element:
    contract: risk/sensitivity-element@1
    about: The position sensitivities one element a row, each with its trade's netting set and product group; SIMM reads the netting set's.
    required: false
    key: [ SENSITIVITY_ID, ELEMENT ]
    columns: [ SENSITIVITY_ID, ELEMENT, TRADE_ID, POSITION_ID, NETTING_SET, COUNTERPARTY, LEGAL_ENTITY, DESK, TT_BOOK, PRODUCT_GROUP, RISK_FACTOR,
               MEASURE, VALUE, CURRENCY, IMPLIED_VOL ]
    scope-columns: [ COUNTERPARTY, LEGAL_ENTITY, DESK, TT_BOOK, NETTING_SET ]
  risk-factor:
    contract: risk/risk-factor@1
    about: The factor dictionary's SIMM mapping (the CRIF terms) of every factor the elements name.
    required: false
    key: [ RISK_FACTOR ]
    columns: [ RISK_FACTOR, SIMM_RISK_CLASS, FACTOR_TYPE, SIMM_BUCKET, QUALIFIER, SIMM_LABEL1, SIMM_LABEL2, SENIORITY ]
  simm-parameters:
    contract: risk/simm-parameters@1
    about: The bank's licensed ISDA SIMM parameter files, one row per version (TEXT, the file as delivered); absent, SIMM is not found, never estimated.
    required: false
    per: []
    key: [ VERSION ]
    columns: [ VERSION, TEXT ]
  fx-spot:
    contract: market/fx-spot@1
    about: The date's FX mids (PAIR as EURUSD) that take sensitivities into the calculation currency; without it only that currency's elements are used.
    required: false
    key: [ PAIR ]
    columns: [ PAIR, MID ]
options:
  model: { type: enum, options: [ lagged, current, none ], default: lagged, label: Collateral model }
  rule: { type: enum, options: [ kth, interpolated ], default: kth, label: Quantile rule }
  confidences: { type: list, items: number, default: [ 0.95, 0.99 ], label: PFE confidences }
  pfe-confidence: { type: number, default: 0.95, min: 0.5, max: 0.9999, label: Headline PFE confidence }
  pfe-window: { type: int, default: 21, min: 1, label: Effective window (grid points) }
  im-model: { type: enum, options: [ held, none ], default: held, label: Initial margin }
  alpha: { type: number, default: 1.4, min: 1, max: 10, label: IMM alpha, help: "EAD = alpha x EEPE in the pre-deal answer." }
  limit-near: { type: number, default: 0.8, min: 0.01, max: 1, label: Near share of a limit }
  vector-tier: { type: enum, options: [ heap, mapped ], default: heap, label: Matrix rows, help: "The netting-set matrices as the host's exposure tier keeps them. heap: float64; mapped: every value, exposure and negative-exposure row float32 (rounded once, read into float64 sums), as a mapped tier's hot file: the host and the engine agree to the bit (R2_CUT_PLAN MC-12). Scope sums stay float64 either way." }
  simm-product-classes:
    type: records
    label: SIMM product classes
    help: The product class of a record's PRODUCT_GROUP (SIMM paragraph 6); a group not listed takes the default.
    fields:
      group: { type: text, required: true }
      class: { type: enum, options: [ RatesFX, Credit, Equity, Commodity ], required: true }
    default: [ { group: Rates, class: RatesFX }, { group: Inflation, class: RatesFX }, { group: Money market, class: RatesFX }, { group: FX, class: RatesFX },
               { group: Fixed income, class: RatesFX }, { group: Securities financing, class: RatesFX }, { group: Structured, class: RatesFX },
               { group: Credit, class: Credit }, { group: Equity, class: Equity }, { group: Commodity, class: Commodity } ]
  simm-default-product-class: { type: enum, options: [ RatesFX, Credit, Equity, Commodity ], default: RatesFX, label: SIMM default product class }
params:
  scope: { type: text, default: BANK, label: Scope, help: "BANK, NSET:<id>, CPTY:<id>, LE:<id>, DESK:<id>, BOOK:<id>, TRD:<id>,..." }
  standalone: { type: bool, default: false, label: Standalone, help: "True: the scope's trades as if they were netted only among themselves." }
  confidence: { type: number, default: 0, min: 0, max: 0.9999, label: PFE confidence, help: "The PFE confidence of the answer (above 0.5); 0: the engine's pfe-confidence." }
  collateral: { type: text, default: "", label: Collateral model, help: "lagged, current or none (the uncollateralised view); empty: the engine's model." }
  by: { type: text, default: netting-set, label: Parts, help: "netting-set, counterparty, legal-entity, trade or asset: the parts of exposure-contributions." }
  figure: { type: text, default: PFE, label: Figure, help: "EE, EPE or PFE: the figure exposure-contributions splits." }
  at: { type: int, default: -1, min: -1, label: Primary point, help: "The primary grid point of an EE or PFE contribution or of a distribution; -1: the figure's own point (the peak; a distribution's: the peak PFE's)." }
  bins: { type: int, default: 42, min: 1, max: 500, label: Histogram bins, help: "The bins of exposure-histogram." }
  counterparty: { type: text, default: "", label: Counterparty, help: The counterparty the new trade is with. }
  template: { type: text, default: "", label: Template trade, help: "A booked trade whose paths on the date's run are copied, scaled to the notional." }
  notional: { type: number, default: 0, min: 0, label: Notional, help: "0: the template's own notional." }
  reverse: { type: bool, default: false, label: Reverse, help: "True: the opposite side of the template." }
  netting-set: { type: text, default: "", label: Netting set, help: "The netting set the trade goes into; empty: the template's, or the counterparty's only one." }
  groups:
    type: table
    contract: risk/counterparty-group-member@1
    max-rows: 100000
    label: Connected groups
    help: "Each connected group's member counterparties (GROUP, COUNTERPARTY), as the host's reference holds them: a GROUP:<id> scope reads its members here (also GRP-<id>); absent, a group is not known."
  method: { type: enum, options: [ paths, addon ], default: paths, label: What-if method, help: "paths: each candidate's MtM on every path of the run added to its netting set (exact); addon: the conservative proxy (each candidate a netting set of its own, uncollateralised, SA-CCR's supervisory factor)." }
  candidates:
    type: table
    contract: risk/exposure-candidate@1
    max-rows: 200
    label: Candidates
    help: "The hypothetical trades: ID, LABEL, NETTING_SET (empty: a set of its own), RUN_ID (the run its paths are of; empty: the date's), COPY_OF (a booked trade whose paths are copied) and FACTOR, or MTM (the G x P paths, grid-date-major), MTM0 (its MtM today; empty: the copy's or the paths' mean), LIFE_YEARS; addon: ASSET_CLASS, NOTIONAL, DELTA, MTM0, LIFE_YEARS."
  scopes: { type: list, items: text, label: Scopes, help: "The scopes of exposure-official, in order (BANK, NSET:<id>, CPTY:<id>, GROUP:<id>, LE:<id>, WHERE:...)." }
  scope-members:
    type: table
    contract: risk/scope-member@1
    max-rows: 2000000
    label: Scope members
    help: "Scopes of exposure-official the host resolves itself (a hierarchy's node over the trades' level columns, which the engine's rows do not carry): SCOPE, TRADE_ID; such a scope is its trades evaluated as a set, each netting set whole or partial, never standalone."
  simm-scope: { type: text, default: "", label: SIMM netting set, help: "NSET:<id> or CPTY:<id>; empty: every netting set of the sensitivities." }
  direction: { type: enum, options: [ collect, post ], default: collect, label: Direction }
  calculation-currency: { type: text, default: USD, label: Calculation currency }
  simm-version: { type: text, default: "", label: SIMM version, help: "A VERSION of simm-parameters; empty: the newest." }
  concentration: { type: enum, options: [ "on", "off" ], default: "on", label: Concentration }
  hvr: { type: enum, options: [ "on", "off" ], default: "on", label: Historical volatility ratios }
outputs:
  exposure-summary:
    title: Exposure figures of a scope
    about: One row for the scope asked.
    shape: row
    params: [ scope, standalone, confidence, collateral, groups ]
    key: [ SCOPE ]
    columns:
      - { name: SCOPE, type: string, nullable: false, label: Scope }
      - { name: TRADES, type: integer, nullable: false, label: Trades }
      - { name: CE, type: number, nullable: false, label: Current exposure, measure: true }
      - { name: EPE, type: number, nullable: false, label: EPE, measure: true }
      - { name: EEPE, type: number, nullable: false, label: Effective EPE, measure: true }
      - { name: PEAK_EE, type: number, nullable: false, label: Peak EE, measure: true }
      - { name: PEAK_PFE, type: number, nullable: false, label: Peak PFE, measure: true }
      - { name: PEAK_PFE_DATE, type: date, nullable: true, label: Peak PFE date }
  exposure-profile:
    title: Exposure profile of a scope
    about: One row per primary grid point.
    shape: series
    axis: POINT
    params: [ scope, standalone, confidence, collateral, groups ]
    key: [ POINT ]
    columns:
      - { name: POINT, type: integer, nullable: false, label: Point }
      - { name: DATE, type: date, nullable: false, label: Date }
      - { name: TENOR, type: string, nullable: true, label: Tenor }
      - { name: EE, type: number, nullable: false, label: EE, measure: true }
      - { name: ENE, type: number, nullable: false, label: ENE, measure: true }
      - { name: EEE, type: number, nullable: false, label: Effective EE, measure: true }
      - { name: PFE, type: number, nullable: false, label: PFE, measure: true }
      - { name: EE_UNCOLL, type: number, nullable: false, label: EE uncollateralised, measure: true }
  exposure-contributions:
    title: Contributions to a scope's exposure
    about: "Each part of the scope (by netting set, counterparty, legal entity, trade or asset) and its contribution to one figure (EE, EPE or PFE; at a primary point, or the figure's own: the peak EE, EPE, the peak PFE), its share and, for PFE, its incremental exposure; in the calculation's order (RANK). Trades and assets read each trade's paths."
    params: [ scope, standalone, confidence, collateral, groups, by, figure, at ]
    key: [ RANK ]
    columns:
      - { name: RANK, type: integer, nullable: false, label: Order }
      - { name: KEY, type: string, nullable: false, label: Part }
      - { name: SCOPE, type: string, nullable: true, label: Part scope }
      - { name: LABEL, type: string, nullable: true, label: Label }
      - { name: KIND, type: string, nullable: false, label: Kind }
      - { name: VALUE, type: number, nullable: false, label: Contribution, measure: true }
      - { name: PCT, type: number, nullable: true, label: Share }
      - { name: INCREMENTAL, type: number, nullable: true, label: Incremental }
  scope-resolution:
    title: How a scope reads
    about: The scope's canonical text, its kind (bank, netting-set, counterparty, group, legal-entity, desk, book, trade, trades or adhoc), its id when it names one, and the trades it holds that the request sees.
    params: [ scope, groups ]
    key: [ SCOPE ]
    columns:
      - { name: SCOPE, type: string, nullable: false, label: Scope }
      - { name: CANONICAL, type: string, nullable: false, label: Canonical }
      - { name: KIND, type: string, nullable: false, label: Kind }
      - { name: ID, type: string, nullable: true, label: Id }
      - { name: TRADES, type: integer, nullable: false, label: Trades }
  netting-set-summary:
    title: Exposure figures of every netting set
    about: One row per netting set, standalone.
    key: [ NETTING_SET ]
    columns:
      - { name: NETTING_SET, type: string, nullable: false, label: Netting set }
      - { name: COUNTERPARTY, type: string, nullable: true, label: Counterparty }
      - { name: TRADES, type: integer, nullable: false, label: Trades }
      - { name: CE, type: number, nullable: false, label: Current exposure, measure: true }
      - { name: EPE, type: number, nullable: false, label: EPE, measure: true }
      - { name: EEPE, type: number, nullable: false, label: Effective EPE, measure: true }
      - { name: PEAK_PFE, type: number, nullable: false, label: Peak PFE, measure: true }
  counterparty-summary:
    title: Exposure figures of every counterparty
    about: One row per counterparty with paths the request sees (its netting sets netted each, then added), in counterparty order; the same figures as exposure-summary of CPTY:<id>, and the counterparty's stored credit limit (credit-limit, the first by id; empty without one or without the input).
    params: [ confidence, collateral ]
    key: [ COUNTERPARTY ]
    columns:
      - { name: COUNTERPARTY, type: string, nullable: false, label: Counterparty }
      - { name: NETTING_SETS, type: integer, nullable: false, label: Netting sets }
      - { name: TRADES, type: integer, nullable: false, label: Trades }
      - { name: CE, type: number, nullable: false, label: Current exposure, measure: true }
      - { name: EPE, type: number, nullable: false, label: EPE, measure: true }
      - { name: EEPE, type: number, nullable: false, label: Effective EPE, measure: true }
      - { name: PEAK_EE, type: number, nullable: false, label: Peak EE, measure: true }
      - { name: PEAK_PFE, type: number, nullable: false, label: Peak PFE, measure: true }
      - { name: PEAK_PFE_DATE, type: date, nullable: true, label: Peak PFE date }
      - { name: LIMIT_ID, type: string, nullable: true, label: Credit limit }
      - { name: LIMIT, type: number, nullable: true, label: Limit amount }
  exposure-tree:
    title: The exposure tree
    about: "Every netting set with paths the request sees (in the book's order), every counterparty (in counterparty order), the bank and every legal entity (in order), each scope evaluated as exposure-summary evaluates it under the request's confidence and collateral model: its netting sets, trades, EPE, peak EE, peak PFE and the peak's tenor, and its flags (comma-separated); NOTE, and no figures, when an interactive answer cannot sum the scope. A host joins its own names, groups and reference netting sets."
    params: [ confidence, collateral ]
    key: [ SCOPE ]
    columns:
      - { name: SCOPE, type: string, nullable: false, label: Scope }
      - { name: KIND, type: string, nullable: false, label: Kind }
      - { name: ID, type: string, nullable: false, label: Id }
      - { name: NETTING_SETS, type: integer, nullable: true, label: Netting sets }
      - { name: TRADES, type: integer, nullable: true, label: Trades }
      - { name: EPE, type: number, nullable: true, label: EPE, measure: true }
      - { name: PEAK_EE, type: number, nullable: true, label: Peak EE, measure: true }
      - { name: PEAK_PFE, type: number, nullable: true, label: Peak PFE, measure: true }
      - { name: PEAK_PFE_TENOR, type: string, nullable: true, label: Peak PFE tenor }
      - { name: FLAGS, type: string, nullable: false, label: Flags }
      - { name: NOTE, type: string, nullable: true, label: Note }
      - { name: ORDER, type: integer, nullable: false, label: Order of the nodes }
  exposure-tree-ee:
    title: The exposure tree's EE lines
    about: Each scope of exposure-tree with figures, its EE at every primary grid point (the tree's sparklines).
    params: [ confidence, collateral ]
    key: [ SCOPE, POINT ]
    columns:
      - { name: SCOPE, type: string, nullable: false, label: Scope }
      - { name: POINT, type: integer, nullable: false, label: Point }
      - { name: EE, type: number, nullable: false, label: EE, measure: true }
  exposure-run:
    title: The date's simulation run
    about: One row: the run's id, the number of paths, the grid's dates and its primary dates, as the book holds them.
    shape: row
    key: [ RUN_ID ]
    columns:
      - { name: RUN_ID, type: string, nullable: false, label: Run }
      - { name: PATHS, type: integer, nullable: false, label: Paths }
      - { name: GRID_DATES, type: integer, nullable: false, label: Grid dates }
      - { name: PRIMARY_DATES, type: integer, nullable: false, label: Primary dates }
  exposure-flags:
    title: A scope's netting sets and flags
    about: One row for the scope asked, the netting sets it sums and its flags comma-separated (partial, standalone, its netting sets' data-quality flags such as PAST_MATURITY or MPOR_MISMATCH).
    shape: row
    params: [ scope, standalone, confidence, collateral, groups ]
    key: [ SCOPE ]
    columns:
      - { name: SCOPE, type: string, nullable: false, label: Scope }
      - { name: NETTING_SETS, type: integer, nullable: false, label: Netting sets }
      - { name: FLAGS, type: string, nullable: false, label: Flags }
  exposure-distribution:
    title: A scope's exposure distribution at a point
    about: "The scope's exposure across the paths at one primary point (at; -1: the peak PFE's point at the request's confidence): its mean (EE), the share of paths without exposure, the number of paths, the lowest and highest path."
    shape: row
    params: [ scope, standalone, confidence, collateral, groups, at ]
    key: [ SCOPE ]
    columns:
      - { name: SCOPE, type: string, nullable: false, label: Scope }
      - { name: POINT, type: integer, nullable: false, label: Point }
      - { name: DATE, type: date, nullable: false, label: Date }
      - { name: TENOR, type: string, nullable: true, label: Tenor }
      - { name: MEAN, type: number, nullable: false, label: Mean (EE), measure: true }
      - { name: ZERO_SHARE, type: number, nullable: false, label: Paths without exposure }
      - { name: PATHS, type: integer, nullable: false, label: Paths }
      - { name: LOW, type: number, nullable: false, label: Lowest path, measure: true }
      - { name: HIGH, type: number, nullable: false, label: Highest path, measure: true }
  exposure-histogram:
    title: A scope's exposure histogram at a point
    about: "The distribution's bins (bins of equal width from the lowest path to the highest; width 1 when every path is equal): each edge, and the paths from it to the next (the last edge has none)."
    params: [ scope, standalone, confidence, collateral, groups, at, bins ]
    key: [ EDGE_INDEX ]
    columns:
      - { name: EDGE_INDEX, type: integer, nullable: false, label: Edge }
      - { name: EDGE, type: number, nullable: false, label: From }
      - { name: COUNT, type: integer, nullable: true, label: Paths }
  exposure-fan:
    title: A scope's exposure quantiles at every point
    about: "The scope's exposure quantiles (5, 25, 50, 75, 90, 95, 97.5 and 99%) across the paths at every primary point, under the engine's quantile rule: the path fan around EE and a distribution's quantiles."
    params: [ scope, standalone, confidence, collateral, groups ]
    key: [ POINT, QUANTILE ]
    columns:
      - { name: POINT, type: integer, nullable: false, label: Point }
      - { name: QUANTILE, type: number, nullable: false, label: Quantile }
      - { name: DATE, type: date, nullable: false, label: Date }
      - { name: TENOR, type: string, nullable: true, label: Tenor }
      - { name: T, type: number, nullable: false, label: Years }
      - { name: VALUE, type: number, nullable: false, label: Exposure, measure: true }
  exposure-what-if:
    title: Exposure what-if of a scope
    about: "A scope's exposure before and after hypothetical trades (EXPOSURE_GUIDE.md section 18.7): method paths, each candidate's MtM on every path added to its netting set path by path, collateral and exposure computed again (rows BEFORE, AFTER and ITEM:<id> with the candidate's peak PFE alone and its incremental peak PFE); method addon, the conservative proxy on the scope's own profile (EPE, peak EE and peak PFE only). The engine prices nothing: the candidates' paths are a booked trade's or supplied."
    params: [ scope, confidence, collateral, groups, method, candidates ]
    key: [ ROW ]
    columns:
      - { name: ROW, type: string, nullable: false, label: Row }
      - { name: LABEL, type: string, nullable: true, label: Label }
      - { name: NETTING_SET, type: string, nullable: true, label: Netting set }
      - { name: CANONICAL, type: string, nullable: true, label: Scope as read }
      - { name: RUN_ID, type: string, nullable: true, label: Run }
      - { name: CE, type: number, nullable: true, label: Current exposure, measure: true }
      - { name: EPE, type: number, nullable: true, label: EPE, measure: true }
      - { name: EEPE, type: number, nullable: true, label: Effective EPE, measure: true }
      - { name: PEAK_EE, type: number, nullable: true, label: Peak EE, measure: true }
      - { name: PEAK_PFE, type: number, nullable: true, label: Peak PFE, measure: true }
      - { name: PEAK_PFE_TENOR, type: string, nullable: true, label: Peak PFE tenor }
      - { name: PEAK_PFE_ALONE, type: number, nullable: true, label: Peak PFE alone, measure: true }
      - { name: INCREMENTAL_PEAK_PFE, type: number, nullable: true, label: Incremental peak PFE, measure: true }
  exposure-what-if-profile:
    title: Exposure what-if profile
    about: "The what-if's profile at every primary point: EE and PFE (the request's confidence) before and after; ADDED, the addon method's own increment at the point."
    params: [ scope, confidence, collateral, groups, method, candidates ]
    key: [ POINT ]
    columns:
      - { name: POINT, type: integer, nullable: false, label: Primary point }
      - { name: DATE, type: string, nullable: false, label: Date }
      - { name: TENOR, type: string, nullable: false, label: Tenor }
      - { name: T, type: number, nullable: false, label: Time (years) }
      - { name: EE_BEFORE, type: number, nullable: false, label: EE before, measure: true }
      - { name: EE_AFTER, type: number, nullable: false, label: EE after, measure: true }
      - { name: PFE_BEFORE, type: number, nullable: false, label: PFE before, measure: true }
      - { name: PFE_AFTER, type: number, nullable: false, label: PFE after, measure: true }
